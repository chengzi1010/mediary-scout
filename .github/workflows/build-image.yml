name: Build Mediary Scout Image
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            MEDIA_TRACK_ALLOWED_ORIGINS=*.onrender.com,*.clawcloudrun.com,*.snapdeploy.app
          tags: ghcr.io/${{ github.repository_owner }}/mediary-scout:latest
